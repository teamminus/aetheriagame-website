<!DOCTYPE html>
<html lang="{{lang}}">

<head>
  <!-- Sets default and correct encoding and viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Title and description -->
  <title>{{head.title}}</title>
  <meta name="description" content="{{head.description}}">

  <!-- SEO meta tags for search engines indexation and score optimisation -->
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <link rel="canonical" href="https://{{url}}/{{lang}}/{{page}}">

  <!-- Open Graph meta tags for social media sharing -->
  <meta property="og:title" content="{{head.og:title}}">
  <meta property="og:description" content="{{head.og:description}}">
  <meta property="og:url" content="https://{{url}}/{{lang}}/{{page}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://{{url}}/assets/images/og-image.jpg">
  <meta property="og:locale" content="{{head.og:locale}}">

  <!-- Alternate language versions for SEO and user experience -->
  <link rel="alternate" hreflang="{{lang}}" href="https://{{url}}/{{lang}}/{{page}}">
  <link rel="alternate" hreflang="{{lang.alt.1}}" href="https://{{url}}/{{lang.alt.1}}/{{page}}">
  <link rel="alternate" hreflang="x-default" href="https://{{url}}/en/{{page}}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/{{page}}.css">
  <link rel="stylesheet" href="/assets/css/{{lang}}-{{page}}.css">

  <link rel="preload" href="/assets/css/global.css" as="style">
  <link rel="preload" href="/assets/css/{{page}}.css" as="style">

  <!-- Scripts -->
  <script src="/assets/js/color-scheme.js"></script>
  <script src="/assets/js/scripts.js" defer></script> <!-- deferred to prevent stop because of unparsed elements -->

  <!-- Metadata/copyright information for SEO & web crawlers -->
  <meta name="author" content="froelen">
  <meta name="copyright" content="© 2026 Team Minus & {{footer.copyright.team}}">
  <!-- Sets the theme color for browsers that support it (usually mobile) -->
  <meta name="theme-color" content="#0B5D1E">
</head>

<body>

  <header id="header">
    <button id="nav-pane-button" class="nav-button">
      <svg class="icon icon-menu" viewBox="0 0 24 24"
        onerror="this.onerror=null; this.src='/assets/images/icons/missing.svg'; this.classList.add('icon-missing')"
        alt="{{header.nav-pane-button.icon.menu}}">
        <use href="/assets/images/icons/menu.svg#icon"></use>
      </svg>
      <svg class="icon icon-cross" viewBox="0 0 24 24"
        onerror="this.onerror=null; this.src='/assets/images/icons/missing.svg'; this.classList.add('icon-missing')"
        alt="{{header.nav-pane-button.icon.cross}}">
        <use href="/assets/images/icons/cross.svg#icon"></use>
      </svg>
    </button>

    <nav id="nav-pane" class="nav-pane">
      <ol>
        <li><a href="#">{{header.nav-pane.home}}</a></li>
        <li><a href="#discover">{{header.nav-pane.discover}}</a></li>
        <li><a href="#contribute">{{header.nav-pane.contribute}}</a></li>
        <li><a href="#contact">{{header.nav-pane.contact}}</a></li>
      </ol>
    </nav>
  </header>

  <main>
    <section id="home">
      <h1>{{home.h1}}</h1>
      <div>
        <button>{{home.button.follow}}</button>
        <button>{{header.nav-pane.contribute}}</button>
      </div>
    </section>
    <div id="cta-scroll">
      <a href="#discover">{{home.cta-scroll}}</a>
    </div>
  </main>

  <footer id="discover">
    <button id="color-scheme-button" class="nav-button">
      <img id="sun-icon" class="icon color-scheme-icon" src="/assets/images/icons/sun.svg" draggable="false"
        onerror="this.onerror=null; this.src='/assets/images/icons/missing.svg'; this.classList.add('icon-missing')"
        alt="{{footer.scheme.sun}}">
      <img id="moon-icon" class="icon color-scheme-icon" src="/assets/images/icons/moon.svg" draggable="false"
        onerror="this.onerror=null; this.src='/assets/images/icons/missing.svg'; this.classList.add('icon-missing')"
        alt="{{footer.scheme.moon}}">
    </button>

    <p id="copyright">© 2026 Team Minus & {{footer.copyright.team}}<br><a href="credits.html">{{footer.credits}}</a></p>

    <div id="site-map">
      <p>
        <a href="index#about">{{footer.map.about}}</a><br>
        <a href="mailto:mc.teamminus@gmail.com" target="_blank">{{footer.map.contact}}</a><br>
        <a href="https://github.com/teamminus/aetheriagame-website" target="_blank">{{footer.map.repo}}</a><br>
      </p>
    </div>
  </footer>

</body>

</html>
